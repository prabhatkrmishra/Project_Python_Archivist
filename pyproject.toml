[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archivist"
version = "0.1.0"
requires-python = ">=3.13"
description = "Offline document search tool — TF-IDF vectors, Qdrant storage, CLI + FastAPI"

[dependencies]
fastapi = "==0.139.0"
uvicorn = "==0.50.0"
scikit-learn = "==1.9.0"
pypdf = "==6.14.2"
python-docx = "==1.2.0"
python-multipart = "*"
qdrant-client = "==1.18.0"
typer = "==0.12.5"
pydantic = "==2.8.2"
pydantic-settings = "==2.4.0"
aiofiles = "==24.1.0"
tqdm = "==4.66.5"
xxhash = "==3.4.1"
rich = "==13.7.0"

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.23.0",
    "httpx==0.27.0",
    "ruff==0.5.0",
]

[project.scripts]
archivist = "archivist.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/archivist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
