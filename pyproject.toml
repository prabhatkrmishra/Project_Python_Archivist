[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archivist"
version = "0.1.0"
requires-python = ">=3.13"
description = "Offline document search tool — SQLite FTS5 storage, CLI + FastAPI"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-multipart",
    "typer>=0.12.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "py7zr>=1.1.0",
    "rarfile>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[project.scripts]
archivist = "archivist.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/archivist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
