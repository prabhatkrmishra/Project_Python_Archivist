services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-archivist-dev-key}
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-archivist-dev-key}
      - API_KEY=${API_KEY:-archivist-dev-key}
      - VECTORIZER_N_FEATURES=1048576
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/data

volumes:
  qdrant_data:
